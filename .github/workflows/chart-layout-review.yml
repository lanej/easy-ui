name: Chart layout review

on:
  pull_request: ~
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: chart-layout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  viewrule:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - name: Build chart examples
        working-directory: scripts/preview-metrics
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - id: proof
        uses: ./.github/actions/browser-proof
        with:
          suite: charts-layout
          built: scripts/preview-metrics/dist
      - name: Check out View Rule 0.7.0 (pinned)
        if: steps.proof.outputs.reuse != 'true'
        uses: actions/checkout@v4
        with:
          repository: lanej/viewrule
          ref: 6d36031935a824c650e049a14aeb9770e042bb95
          path: .viewrule-engine
      - name: Install View Rule and Chromium
        if: steps.proof.outputs.reuse != 'true'
        working-directory: .viewrule-engine
        run: |
          npm ci --omit=dev --no-audit --no-fund
          node bin/viewrule.mjs install-browser --with-deps
      - name: Inspect the declared design contract
        if: steps.proof.outputs.reuse != 'true'
        run: node .viewrule-engine/bin/viewrule.mjs contract
      - name: Review charts with View Rule
        if: steps.proof.outputs.reuse != 'true'
        run: |
          cd scripts/preview-metrics
          npm exec vite -- preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/chart-preview.log 2>&1 &
          cd ../..
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node .viewrule-engine/bin/viewrule.mjs check --full
      - name: Upload measured findings and full-resolution captures
        if: always() && steps.proof.outputs.reuse != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chart-layout-review
          path: .ui-review/runs/
          include-hidden-files: true
          if-no-files-found: warn
      - uses: ./.github/actions/browser-proof
        if: success() && steps.proof.outputs.reuse != 'true'
        with:
          mode: record
          suite: charts-layout
          digest: ${{ steps.proof.outputs.digest }}
