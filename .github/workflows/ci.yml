name: CI

on:
  push:
    branches: [main]
  pull_request: ~
  workflow_dispatch: ~

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v3
        with:
          node-version-file: ".nvmrc"
      - name: Install dependencies
        run: npm i
      - name: Build
        run: npm run build
      - name: Verify chart package imports and server rendering
        run: node scripts/check-chart-package.mjs
      - name: Verify compatibility entry generation
        run: node --test scripts/generateCompatibilityEntries.test.mjs
      - name: Verify browser CI evidence selection
        run: node --test scripts/browser-proof.test.mjs
      - name: Verify isolated tarball imports and Sass assets
        run: node scripts/check-style-package.mjs
      - name: Retain packed-consumer logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packed-consumer-logs
          path: /tmp/easy-ui-style-package-*/**/*.log
          if-no-files-found: ignore
      - name: Linting
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Build storybook
        run: npm run build:storybook
