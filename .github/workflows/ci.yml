name: CI

on:
  push:
    branches: [main]
  pull_request: ~
  workflow_dispatch: ~

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v3
        with:
          node-version-file: ".nvmrc"
      - name: Install dependencies
        run: npm i
      - name: Build
        run: npm run build
      - name: Verify chart package imports and server rendering
        run: node scripts/check-chart-package.mjs
      - name: Verify compatibility entry generation
        run: node --test scripts/generateCompatibilityEntries.test.mjs
      - name: Verify browser CI evidence selection
        run: node --test scripts/browser-proof.test.mjs
      - name: Verify isolated tarball imports and Sass assets
        run: node scripts/check-style-package.mjs
      - name: Retain packed-consumer logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packed-consumer-logs
          path: /tmp/easy-ui-style-package-*/**/*.log
          if-no-files-found: ignore
      - name: Linting
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Build storybook
        run: npm run build:storybook
      - name: Install browser test dependencies
        working-directory: scripts/preview-metrics
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        working-directory: scripts/preview-metrics
        run: npx playwright install --with-deps chromium
      - name: Verify facility and responsive health layouts
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/scripts/preview-metrics/node_modules/playwright
          STORYBOOK_URL: http://127.0.0.1:9018
          FACILITY_REPORT_DIR: ${{ runner.temp }}/facility-summary-browser
        run: |
          python3 -m http.server 9018 --bind 127.0.0.1 --directory storybook-static > "$RUNNER_TEMP/facility-storybook.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent "$STORYBOOK_URL/iframe.html" > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent "$STORYBOOK_URL/iframe.html" > /dev/null
          node scripts/check-facility-summary.mjs
      - name: Retain facility browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facility-summary-browser
          path: |
            ${{ runner.temp }}/facility-summary-browser
            ${{ runner.temp }}/facility-storybook.log
          if-no-files-found: ignore
