name: Dependency arrow preparation
on:
  pull_request:
    paths:
      - scripts/prepare-dependency-arrowheads.py
      - .github/workflows/dependency-arrow-preparation.yml
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Apply and format source revision
        run: |
          mkdir -p /tmp/arrow-candidate
          sed -i 's/check-dependency-graph-heading-routing.mjs/check-dependency-graph.mjs/g' scripts/prepare-dependency-arrowheads.py
          python3 scripts/prepare-dependency-arrowheads.py
          npm exec --yes --package prettier@3.9.6 -- prettier --write easy-ui-react/src/DependencyGraph/routing.ts easy-ui-react/src/DependencyGraph/routing.arrowheads.test.tsx easy-ui-react/src/DependencyGraph/DependencyGraph.tsx easy-ui-react/src/DependencyGraph/DependencyGraphConvergence.tsx easy-ui-react/src/DependencyGraph/DependencyGraph.mdx scripts/check-dependency-graph-arrowheads.mjs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('easy-ui-react/src/DependencyGraph/routing.ts')
          p.write_text(p.read_text().rstrip('\n') + '\n')
          PY
      - name: Prepare Git tree without updating refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add easy-ui-react/src/DependencyGraph scripts/check-dependency-graph-arrowheads.mjs .changeset/readable-source-dependency-graphs.md .github/workflows/ci.yml
          git rm --cached scripts/prepare-dependency-arrowheads.py .github/workflows/dependency-arrow-preparation.yml
          git diff --cached > /tmp/arrow-candidate/changes.patch
          python3 - <<'PY'
          import base64, json, os, subprocess, urllib.request
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args]).decode().strip()
          def api(path, body=None):
              request = urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/'+path, data=None if body is None else json.dumps(body).encode(), headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request) as response:
                  return json.load(response)
          head = git('rev-parse','HEAD')
          elements=[]
          for name in git('diff','--cached','--name-only').splitlines():
              if not git('ls-files','--stage','--',name):
                  elements.append({'path':name,'mode':'100644','type':'blob','sha':None})
              else:
                  content=subprocess.check_output(['git','show',':'+name])
                  blob=api('git/blobs',{'content':base64.b64encode(content).decode(),'encoding':'base64'})
                  elements.append({'path':name,'mode':'100644','type':'blob','sha':blob['sha']})
                  target=Path('/tmp/arrow-candidate/source')/name
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(content)
          tree=api('git/trees',{'base_tree':api('git/commits/'+head)['tree']['sha'],'tree':elements})
          Path('/tmp/arrow-candidate/candidate.json').write_text(json.dumps({'parent':head,'tree':tree['sha'],'files':[e['path'] for e in elements]},indent=2))
          print('Candidate tree:',tree['sha'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-arrow-candidate
          path: /tmp/arrow-candidate
          if-no-files-found: ignore
