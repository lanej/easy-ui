name: Prepare dependency graph regression
on:
  push:
    branches: [fix/dependency-graph-real-world]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dependency-graph-real-world
      - name: Scope the suffix assertion and retain source-story screenshots
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/check-dependency-graph-source.mjs')
          s = p.read_text().replace('label.querySelector("span span:last-child > span")', 'label.querySelector(":scope > span > span:last-child > span")')
          marker = '      const cards = page.locator("[data-graph-resource-card]");'
          if 'source-only-evidence-${theme}-${width}.png' not in s:
              assert s.count(marker) == 1
              s = s.replace(marker, '''      if (width !== 320)
                  await page.locator("[data-dependency-graph]").screenshot({
                    path: resolve(output, `source-only-evidence-${theme}-${width}.png`),
                  });
          ''' + marker)
          p.write_text(s)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format browser regression
        run: npx prettier --write scripts/check-dependency-graph-source.mjs
      - name: Preserve browser regression on the task branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/check-dependency-graph-source.mjs
          git diff --cached --quiet || git commit -m 'test(dependency-graph): scope suffix measurement to the resource label'
          git push origin HEAD:fix/dependency-graph-real-world
      - name: Build
        id: build
        run: npm run build > /tmp/graph-build.log 2>&1
      - name: Lint
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run lint > /tmp/graph-lint.log 2>&1
      - name: Graph unit tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm exec --workspace @easypost/easy-ui -- vitest run src/DependencyGraph/ > /tmp/graph-tests.log 2>&1
      - name: Build Storybook
        id: storybook
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run build:storybook > /tmp/graph-storybook.log 2>&1
      - name: Install browser dependencies
        if: ${{ !cancelled() && steps.storybook.outcome == 'success' }}
        working-directory: scripts/preview-metrics
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify source-evidence interactions and capture output
        if: ${{ !cancelled() && steps.storybook.outcome == 'success' }}
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/scripts/preview-metrics/node_modules/playwright
          STORYBOOK_URL: http://127.0.0.1:9018
          FACILITY_REPORT_DIR: /tmp/graph-browser
        run: |
          python3 -m http.server 9018 --bind 127.0.0.1 --directory storybook-static > /tmp/graph-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid"' EXIT
          for attempt in {1..30}; do curl --fail --silent "$STORYBOOK_URL/iframe.html" >/dev/null && break; sleep 1; done
          node scripts/check-dependency-graph-source.mjs > /tmp/graph-browser.log 2>&1
      - name: Retain screenshots and remove preparation-only files
        run: |
          cp /tmp/graph-browser/dependency-graph/source-only-evidence-light-1440.png documentation/images/dependency-graph-source-only-desktop.png
          cp /tmp/graph-browser/dependency-graph/source-only-evidence-dark-390.png documentation/images/dependency-graph-source-only-mobile.png
          git rm scripts/.apply-dependency-graph-fix.py scripts/.refine-dependency-graph-fix.py .github/workflows/dependency-graph-preparation.yml
          git add documentation/images/dependency-graph-source-only-desktop.png documentation/images/dependency-graph-source-only-mobile.png
          git commit -m 'test(dependency-graph): retain real-world browser evidence'
          git push origin HEAD:fix/dependency-graph-real-world
      - name: Retain validation evidence and changed source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-graph-preparation
          path: |
            /tmp/graph-*.log
            /tmp/graph-browser
            easy-ui-react/src/DependencyGraph
            scripts/check-dependency-graph.mjs
            scripts/check-dependency-graph-source.mjs
          include-hidden-files: true
