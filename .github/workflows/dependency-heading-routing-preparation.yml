name: Dependency heading routing preparation
on:
  pull_request:
    paths:
      - .github/workflows/dependency-heading-routing-preparation.yml
      - scripts/prepare-dependency-heading-routing.py
      - scripts/check-dependency-graph-heading-routing.mjs
      - easy-ui-react/src/DependencyGraph/useDependencyGraphHeadings*
      - easy-ui-react/src/DependencyGraph/routing.headings.test.ts
permissions:
  contents: write
jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply guarded heading routing correction
        run: |
          mkdir -p /tmp/dependency-heading-routing-review
          python3 scripts/prepare-dependency-heading-routing.py
      - name: Dependencies
        run: npm ci --no-audit --no-fund > /tmp/dependency-heading-routing-review/install.log 2>&1
      - name: Format changed files
        run: npx prettier --write easy-ui-react/src/DependencyGraph/DependencyGraph.module.scss easy-ui-react/src/DependencyGraph/DependencyGraph.tsx easy-ui-react/src/DependencyGraph/DependencyGraph.mdx easy-ui-react/src/DependencyGraph/useDependencyGraphHeadings.ts easy-ui-react/src/DependencyGraph/useDependencyGraphHeadings.test.tsx easy-ui-react/src/DependencyGraph/routing.headings.test.ts scripts/check-dependency-graph-heading-routing.mjs scripts/check-dependency-graph.mjs
      - name: Build
        run: npm run build > /tmp/dependency-heading-routing-review/build.log 2>&1
      - name: Lint
        run: npm run lint > /tmp/dependency-heading-routing-review/lint.log 2>&1
      - name: Unit tests
        run: npm run test > /tmp/dependency-heading-routing-review/test.log 2>&1
      - name: Storybook
        run: npm run build:storybook > /tmp/dependency-heading-routing-review/storybook.log 2>&1
      - name: Browser dependencies
        working-directory: scripts/preview-metrics
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Heading routing, contrast, and dependency regressions
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/scripts/preview-metrics/node_modules/playwright
          STORYBOOK_URL: http://127.0.0.1:9018
          FACILITY_REPORT_DIR: /tmp/dependency-heading-routing-review/browser
        run: |
          python3 -m http.server 9018 --bind 127.0.0.1 --directory storybook-static > /tmp/dependency-heading-routing-review/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent "$STORYBOOK_URL/iframe.html" > /dev/null; then break; fi
            sleep 1
          done
          node scripts/check-dependency-graph-heading-routing.mjs > /tmp/dependency-heading-routing-review/heading-browser.log 2>&1
          node scripts/check-dependency-graph-groups.mjs > /tmp/dependency-heading-routing-review/groups-browser.log 2>&1
          node scripts/check-dependency-graph.mjs > /tmp/dependency-heading-routing-review/regression-browser.log 2>&1
      - name: Retain current screenshots and prepare candidate tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp /tmp/dependency-heading-routing-review/browser/dependency-subgraphs/nested-subgraphs-light-1440.png documentation/images/dependency-subgraphs-desktop.png
          cp /tmp/dependency-heading-routing-review/browser/dependency-subgraphs/nested-subgraphs-dark-390.png documentation/images/dependency-subgraphs-mobile.png
          cp /tmp/dependency-heading-routing-review/browser/dependency-subgraphs/collapsed-subgraphs-light-1440.png documentation/images/dependency-subgraphs-collapsed.png
          cp /tmp/dependency-heading-routing-review/browser/dependency-contrast/nested-subgraphs-dark-1440.png documentation/images/dependency-contrast-dark.png
          cp /tmp/dependency-heading-routing-review/browser/dependency-contrast/overview-dark.png documentation/images/dependency-contrast-overview.png
          cp /tmp/dependency-heading-routing-review/browser/dependency-heading-routing/nested-subgraphs-dark-1440.png documentation/images/dependency-heading-routing-dark.png
          cp /tmp/dependency-heading-routing-review/browser/dependency-heading-routing/nested-subgraphs-light-1440.png documentation/images/dependency-heading-routing-light.png
          git rm .github/workflows/dependency-heading-routing-preparation.yml scripts/prepare-dependency-heading-routing.py
          git add .changeset/readable-source-dependency-graphs.md easy-ui-react/src/DependencyGraph/DependencyGraph.module.scss easy-ui-react/src/DependencyGraph/DependencyGraph.tsx easy-ui-react/src/DependencyGraph/DependencyGraph.mdx easy-ui-react/src/DependencyGraph/useDependencyGraphHeadings.ts easy-ui-react/src/DependencyGraph/useDependencyGraphHeadings.test.tsx easy-ui-react/src/DependencyGraph/routing.headings.test.ts scripts/check-dependency-graph-heading-routing.mjs scripts/check-dependency-graph.mjs documentation/images/dependency-subgraphs-desktop.png documentation/images/dependency-subgraphs-mobile.png documentation/images/dependency-subgraphs-collapsed.png documentation/images/dependency-contrast-dark.png documentation/images/dependency-contrast-overview.png documentation/images/dependency-heading-routing-dark.png documentation/images/dependency-heading-routing-light.png
          git diff --cached > /tmp/dependency-heading-routing-review/final.diff
          python3 - <<'PY'
          import base64, json, os, subprocess, urllib.request
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          def api(path, payload):
              req = urllib.request.Request('https://api.github.com/repos/' + repo + path, data=json.dumps(payload).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method='POST')
              with urllib.request.urlopen(req) as response:
                  return json.load(response)
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          base = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')
          tree = []
          for path in filter(None, paths):
              file = Path(path)
              sha = api('/git/blobs', {'encoding': 'base64', 'content': base64.b64encode(file.read_bytes()).decode()})['sha'] if file.exists() else None
              tree.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': sha})
          result = api('/git/trees', {'base_tree': base, 'tree': tree})
          Path('/tmp/dependency-heading-routing-review/transport.json').write_text(json.dumps({'parent_sha': head, 'tree_sha': result['sha'], 'files': tree}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-heading-routing-review
          path: /tmp/dependency-heading-routing-review
          if-no-files-found: error
