name: Dependency subgraphs review
on:
  push:
    branches: [fix/dependency-graph-real-world]
    paths: [.github/workflows/dependency-subgraphs-review.yml]
permissions:
  contents: write
concurrency:
  group: dependency-subgraphs-review
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dependency-graph-real-world
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply scoped source change
        env:
          PATCH_B64: 
        run: |
          mkdir -p /tmp/subgraphs
          python3 - <<'PY'
          import base64, io, os, zipfile
          from pathlib import Path
          archive = zipfile.ZipFile(io.BytesIO(base64.b64decode(os.environ['PATCH_B64'])))
          for name in archive.namelist():
              if name == 'patch_groups.py':
                  continue
              path = Path(name)
              assert not path.is_absolute() and '..' not in path.parts and not path.exists(), name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(archive.read(name))
          exec(compile(archive.read('patch_groups.py'), 'patch_groups.py', 'exec'))
          PY
      - name: Install
        run: npm ci --no-audit --no-fund > /tmp/subgraphs/install.log 2>&1
      - name: Format changed files
        run: npx prettier --write easy-ui-react/src/DependencyGraph/{groups.ts,groups.test.ts,types.ts,model.ts,DependencyGraph.tsx,DependencyGraphDetails.tsx,DependencyGraph.groups.fixtures.ts,DependencyGraph.groups.test.tsx,DependencyGraph.stories.tsx,DependencyGraph.mdx} scripts/check-dependency-graph-groups.mjs .github/workflows/ci.yml .changeset/dependency-subgraphs.md
      - name: Build
        run: npm run build > /tmp/subgraphs/build.log 2>&1
      - name: Lint
        run: npm run lint > /tmp/subgraphs/lint.log 2>&1
      - name: Tests
        run: npm run test > /tmp/subgraphs/test.log 2>&1
      - name: Storybook
        run: npm run build:storybook > /tmp/subgraphs/storybook.log 2>&1
      - name: Browser dependencies
        run: |
          npm ci --no-audit --no-fund --prefix scripts/preview-metrics
          cd scripts/preview-metrics
          npx playwright install --with-deps chromium
      - name: Browser regressions
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/scripts/preview-metrics/node_modules/playwright
          STORYBOOK_URL: http://127.0.0.1:9018
          FACILITY_REPORT_DIR: /tmp/subgraphs/browser
        run: |
          python3 -m http.server 9018 --bind 127.0.0.1 --directory storybook-static > /tmp/subgraphs/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do curl --fail --silent "$STORYBOOK_URL/iframe.html" > /dev/null && break; sleep 1; done
          node scripts/check-dependency-graph-groups.mjs > /tmp/subgraphs/groups-browser.log 2>&1
          node scripts/check-dependency-graph.mjs > /tmp/subgraphs/regression-browser.log 2>&1
      - name: Preserve current screenshots
        run: |
          cp /tmp/subgraphs/browser/dependency-subgraphs/nested-subgraphs-light-1440.png documentation/images/dependency-subgraphs-desktop.png
          cp /tmp/subgraphs/browser/dependency-subgraphs/nested-subgraphs-dark-390.png documentation/images/dependency-subgraphs-mobile.png
      - name: Commit verified changes
        run: |
          expected=$(git rev-parse HEAD)
          remote=$(git ls-remote origin refs/heads/fix/dependency-graph-real-world | cut -f1)
          test "$expected" = "$remote"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add easy-ui-react/src/DependencyGraph scripts/check-dependency-graph-groups.mjs .github/workflows/ci.yml .changeset/dependency-subgraphs.md documentation/images/dependency-subgraphs-desktop.png documentation/images/dependency-subgraphs-mobile.png
          git commit -m 'feat(dependency-graph): support explicit nested subgraphs'
          git push origin HEAD:fix/dependency-graph-real-world
          git rev-parse HEAD > /tmp/subgraphs/verified-head.txt
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-subgraphs-review
          path: |
            /tmp/subgraphs
            easy-ui-react/src/DependencyGraph
            scripts/check-dependency-graph-groups.mjs
            .github/workflows/ci.yml
          if-no-files-found: ignore
