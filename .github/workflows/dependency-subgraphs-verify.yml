name: Publish verified dependency subgraphs
on:
  push:
    branches: [fix/dependency-graph-real-world]
    paths: [.github/workflows/dependency-subgraphs-verify.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: dependency-subgraphs-review
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dependency-graph-real-world
          fetch-depth: 2
      - uses: actions/download-artifact@v4
        with:
          name: dependency-subgraphs-review
          run-id: 38498719565
          github-token: ${{ github.token }}
          path: /tmp/verified-subgraphs
      - name: Preserve concurrent source changes
        run: |
          git fetch --no-tags origin c1e86fb4b032f9f7c08242c159c06a3e1cee32f6
          git diff --exit-code c1e86fb4b032f9f7c08242c159c06a3e1cee32f6 HEAD -- easy-ui-react/src/DependencyGraph scripts/check-dependency-graph-groups.mjs .changeset/dependency-subgraphs.md documentation/images/dependency-subgraphs-desktop.png documentation/images/dependency-subgraphs-mobile.png
      - name: Restore tested sources and screenshots
        run: |
          python3 - <<'PY'
          import json, shutil
          from pathlib import Path
          artifact = Path('/tmp/verified-subgraphs')
          reports = artifact / 'tmp/subgraphs'
          result = json.loads((reports / 'browser/dependency-subgraphs/results.json').read_text())
          assert len(result['checks']) == 18 and result['errors'] == []
          assert 'DependencyGraph: 129 browser cases passed.' in (reports / 'regression-browser.log').read_text()
          source = artifact / 'home/runner/work/easy-ui/easy-ui'
          base = Path('easy-ui-react/src/DependencyGraph')
          names = ['groups.ts', 'groups.test.ts', 'types.ts', 'model.ts', 'DependencyGraph.tsx', 'DependencyGraphDetails.tsx', 'DependencyGraph.groups.fixtures.ts', 'DependencyGraph.groups.test.tsx', 'DependencyGraph.stories.tsx', 'DependencyGraph.mdx']
          for name in names:
              shutil.copyfile(source / base / name, base / name)
          script = Path('scripts/check-dependency-graph-groups.mjs')
          shutil.copyfile(source / script, script)
          docs = base / 'DependencyGraph.mdx'
          text = docs.read_text()
          old = 'Groups are flat visual boundaries.'
          assert text.count(old) == 1
          docs.write_text(text.replace(old, 'Groups are explicit, optionally nested visual boundaries.'))
          Path('.changeset/dependency-subgraphs.md').write_text('---\n"@easypost/easy-ui": minor\n---\n\nSupport explicit nested dependency subgraphs through group parentId, preserving\ncross-boundary relationships, descendant inspection, collapse state, and stable\nresource ordering. Add grouped, nested, and collapsed Storybook examples.\n')
          for source_name, target_name in [('nested-subgraphs-light-1440.png', 'dependency-subgraphs-desktop.png'), ('nested-subgraphs-dark-390.png', 'dependency-subgraphs-mobile.png')]:
              shutil.copyfile(reports / 'browser/dependency-subgraphs' / source_name, Path('documentation/images') / target_name)
          PY
      - name: Commit source only
        run: |
          expected=$(git rev-parse HEAD)
          remote=$(git ls-remote origin refs/heads/fix/dependency-graph-real-world | cut -f1)
          test "$expected" = "$remote"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add easy-ui-react/src/DependencyGraph scripts/check-dependency-graph-groups.mjs .changeset/dependency-subgraphs.md documentation/images/dependency-subgraphs-desktop.png documentation/images/dependency-subgraphs-mobile.png
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git commit -m 'feat(dependency-graph): support explicit nested subgraphs'
          git push origin HEAD:fix/dependency-graph-real-world
