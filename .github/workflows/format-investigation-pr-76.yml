name: Temporary PR 76 workbench formatter
on:
  push:
    branches: [codex/investigation-workbench]
    paths: [.github/workflows/format-investigation-pr-76.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/investigation-workbench
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Format changed workbench source and browser tests
        run: |
          npx prettier --write \
            easy-ui-react/src/InvestigationWorkspace/InvestigationWorkbench.tsx \
            easy-ui-react/src/InvestigationWorkspace/InvestigationWorkbench.module.scss \
            easy-ui-react/src/InvestigationWorkspace/InvestigationWorkbench.examples.tsx \
            easy-ui-react/src/InvestigationWorkspace/InvestigationWorkbench.test.tsx \
            easy-ui-react/src/InvestigationWorkspace/InvestigationWorkbench.selection.test.tsx \
            easy-ui-react/src/InvestigationWorkspace/workbenchState.ts \
            easy-ui-react/src/InvestigationWorkspace/workbenchMap.ts \
            easy-ui-react/src/EventTimeline/EventItem.tsx \
            easy-ui-react/src/EventTimeline/EventTimeline.tsx \
            easy-ui-react/src/EventTimeline/EventTimeline.module.scss \
            scripts/check-investigation-workbench.mjs
      - name: Commit exact formatted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add easy-ui-react/src/InvestigationWorkspace easy-ui-react/src/EventTimeline scripts/check-investigation-workbench.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Format investigation selection and map expansion changes"
            git push origin HEAD:codex/investigation-workbench
          fi
