name: Format timeline branch
on:
  push:
    branches: [feat/reusable-event-timeline]
    paths:
      - "easy-ui-react/src/EventTimeline/**"
      - ".github/workflows/format-timeline.yml"
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'lanej/easy-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reusable-event-timeline
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prettier --write "easy-ui-react/src/EventTimeline/**/*.{ts,tsx,scss}"
      - name: Commit format results
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add easy-ui-react/src/EventTimeline
          git commit -m "style(timeline): apply repository Prettier formatting"
          git push origin HEAD:feat/reusable-event-timeline
