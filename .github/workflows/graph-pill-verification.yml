name: Graph category pill verification
on:
  push:
    branches: [fix/dependency-graph-real-world]
    paths: [.github/workflows/graph-pill-verification.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.ref == 'refs/heads/fix/dependency-graph-real-world'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Apply scoped category pill changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base = Path('easy-ui-react/src/DependencyGraph')
          def edit(name, old, new, count=1):
              path = base / name
              content = path.read_text()
              assert content.count(old) == count, (name, old[:80], content.count(old), count)
              path.write_text(content.replace(old, new))
          edit('types.ts', '  /** Caller-supplied resource type symbol, using Easy UI\'s normal Icon contract. */', '''  /** Caller-owned categorical metadata, rendered as neutral pills. Never interpreted as plan actions or risk. */
            categories?: readonly string[];
            /** Caller-supplied resource type symbol, using Easy UI's normal Icon contract. */''')
          (base / 'DependencyGraphCategories.tsx').write_text('''import React from "react";
          import type { DependencyGraphNode } from "./types";
          import styles from "./DependencyGraph.module.scss";
          /** Caller-owned labels; their text carries no inferred change or risk semantics. */
          export function DependencyGraphCategories({ categories }: Pick<DependencyGraphNode, "categories">) {
            return <>{categories?.filter((label) => label.trim()).map((label, index) => (
              <span key={`${index}:${label}`} className={styles.category} data-graph-category title={label}>{label}</span>
            ))}</>;
          }
          ''')
          edit('DependencyGraphIdentity.tsx', 'import { Icon } from "../Icon";', 'import { Icon } from "../Icon";\nimport { DependencyGraphCategories } from "./DependencyGraphCategories";')
          edit('DependencyGraphIdentity.tsx', '      {(node.typeLabel || node.kind === "unresolved" || node.change) && (', '''      {node.typeLabel && (
                  <span className={styles.nodeType} title={node.typeLabel}>{node.typeLabel}</span>
                )}
                {(node.categories?.some((label) => label.trim()) || node.kind === "unresolved" || node.change) && (''')
          edit('DependencyGraphIdentity.tsx', '''          {node.typeLabel && (
                      <span className={styles.nodeType} title={node.typeLabel}>
                        {node.typeLabel}
                      </span>
                    )}
          ''', '')
          edit('DependencyGraphIdentity.tsx', '''              {overview ||
                        node.change === "unknown" ||
                        node.change === "unchanged"
          ''', '              {overview\n')
          edit('DependencyGraphIdentity.tsx', '''          )}
                  </span>
                )}
                {summary''', '''          )}
                    <DependencyGraphCategories categories={node.categories} />
                  </span>
                )}
                {summary''')
          edit('DependencyGraph.tsx', '${node.address ?? ""} ${node.description ?? ""}', '${node.address ?? ""} ${node.description ?? ""} ${(node.categories ?? []).join(" ")}')
          edit('DependencyGraph.tsx', '                                      node.typeLabel,\n                                      node.description,', '                                      node.typeLabel,\n                                      ...(node.categories ?? []),\n                                      node.description,')
          edit('DependencyGraphDetails.tsx', 'import { DependencyGraphChanges } from "./DependencyGraphChanges";', 'import { DependencyGraphChanges } from "./DependencyGraphChanges";\nimport { DependencyGraphCategories } from "./DependencyGraphCategories";')
          edit('DependencyGraphDetails.tsx', '''                <span
                            className={context.node.change ? styles.change : styles.muted}
                            data-change={context.node.change}
                          >
                            {context.node.change
                              ? dependencyChangeLabels[context.node.change]
                              : "Change not supplied"}
                          </span>''', '''                <div className={styles.nodeMetadata}>
                            <span className={context.node.change ? styles.change : styles.muted} data-change={context.node.change}>
                              {context.node.change ? dependencyChangeLabels[context.node.change] : "Change not supplied"}
                            </span>
                            <DependencyGraphCategories categories={context.node.categories} />
                          </div>''')
          edit('DependencyGraph.module.scss', '.change {\n  display: inline-block;\n  border-radius: 4px;', '.change,\n.category,\n.referenceLabel {\n  display: inline-block;\n  border-radius: 999px;')
          edit('DependencyGraph.module.scss', '  font-weight: 600;\n  white-space: nowrap;\n  &[data-change="create"]', '  font-weight: 600;\n  line-height: 1.4;\n  max-inline-size: 100%;\n  overflow-wrap: anywhere;\n}\n.change {\n  white-space: nowrap;\n  &[data-change="create"]')
          edit('DependencyGraph.module.scss', '.nodeType {\n  overflow: hidden;', '.nodeType {\n  display: block;\n  max-inline-size: 100%;\n  font-size: 0.75rem;\n  color: design-token("color.neutral.700");\n  overflow: hidden;')
          edit('DependencyGraph.module.scss', '  .change {\n    font-size: max(0.75rem, calc(10px / var(--dependency-graph-zoom)));\n  }\n}', '  .change,\n  .category {\n    font-size: max(0.75rem, calc(10px / var(--dependency-graph-zoom)));\n  }\n}')
          edit('DependencyGraph.realWorld.ts', '    description: "Source unchanged",', '    categories: ["Source unchanged"],', count=4)
          edit('DependencyGraph.realWorld.ts', '    changeSummary: "Source modified",\n    description:\n      "A source edit was observed. No captured plan action was supplied.",', '    categories: ["Source modified"],')
          edit('DependencyGraph.stories.tsx', '        description: "Source modified",', '        categories: ["Source modified"],')
          edit('DependencyGraph.stories.tsx', '      { id: "unknown", label: "Explicitly unknown", change: "unknown" },', '      { id: "unknown", label: "Explicitly unknown", change: "unknown", categories: ["Source unchanged"] },')
          edit('DependencyGraph.mdx', 'compact `?` and `=` markers and full accessible labels. Supplied field differences\nstill expand even when no plan operation is supplied.', '''labeled pills at detail zoom and compact `?` and `=` markers in the overview.
          Full accessible labels remain available at every zoom. Supplied field differences
          still expand even when no plan operation is supplied.

          Use `categories: ["Source unchanged"]` or `categories: ["Source modified"]` for
          caller-owned categorical metadata. Categories use neutral pills below the resource
          identity, remain searchable and accessible, and appear in selection details.
          They are independent of `change`: a source edit is not an inferred plan action,
          and a neutral category does not assert risk or safety. Text is never parsed from
          `description` or `changeSummary` to create a category. Keep labels short; multiple
          or longer categories wrap without taking width away from the resource name.''')
          (base / 'DependencyGraph.categories.test.tsx').write_text('''import React from "react";
          import { fireEvent, screen, within } from "@testing-library/react";
          import { render } from "../utilities/test";
          import { DependencyGraph } from "./DependencyGraph";
          import { DependencyGraphIdentity } from "./DependencyGraphIdentity";
          import type { DependencyGraphNode } from "./types";
          const nodes: readonly DependencyGraphNode[] = [
            { id: "source", label: "Source edit", categories: ["Source modified"] },
            { id: "unknown", label: "Unknown plan", change: "unknown", categories: ["Source unchanged"] },
            { id: "unchanged", label: "No-op plan", change: "unchanged" },
          ];
          describe("resource category pills", () => {
            it("keeps categorical source evidence separate from plan actions", () => {
              const { container } = render(<DependencyGraph nodes={nodes} edges={[]} />);
              const source = container.querySelector('[data-graph-resource-card="source"]') as HTMLElement;
              expect(within(source).getByText("Source modified")).toHaveAttribute("data-graph-category");
              expect(source.querySelector("[data-change]")).toBeNull();
              expect(source).not.toHaveAttribute("data-change");
              expect(screen.getByRole("button", { name: "Source edit, Source modified" })).toBeVisible();
              const unknown = container.querySelector('[data-graph-resource-card="unknown"]') as HTMLElement;
              expect(within(unknown).getByText("Source unchanged")).toHaveAttribute("data-graph-category");
              expect(unknown.querySelector('[data-change="unknown"]')).toHaveTextContent("Change unknown");
              const unchanged = container.querySelector('[data-graph-resource-card="unchanged"]') as HTMLElement;
              expect(unchanged.querySelector('[data-change="unchanged"]')).toHaveTextContent("Unchanged");
            });
            it("keeps categories searchable and available in the inspector", () => {
              render(<DependencyGraph nodes={nodes} edges={[]} />);
              fireEvent.change(screen.getByRole("searchbox", { name: "Find resource" }), { target: { value: "Source modified" } });
              expect(within(screen.getByRole("region", { name: "Resource search results" })).getByRole("status")).toHaveTextContent("1 matching resources");
              fireEvent.click(screen.getByRole("button", { name: "Source edit, Source modified" }));
              const details = screen.getByRole("complementary");
              expect(within(details).getByText("Source modified")).toHaveAttribute("data-graph-category");
              expect(within(details).getByText("Change not supplied")).toBeVisible();
            });
            it("does not infer pills from prose or render empty categories", () => {
              const { container } = render(<DependencyGraphIdentity node={{ id: "prose", label: "Resource", description: "Source unchanged", categories: ["", "  "] }} overview={false} />);
              expect(screen.getByText("Source unchanged")).not.toHaveAttribute("data-graph-category");
              expect(container.querySelector("[data-graph-category]")).toBeNull();
              expect(container.querySelector("[data-change]")).toBeNull();
            });
            it("retains category labels and accessible plan meaning in the overview", () => {
              render(<DependencyGraphIdentity node={nodes[1]} overview />);
              expect(screen.getByText("Source unchanged")).toHaveAttribute("data-graph-category");
              expect(screen.getByRole("img", { name: "Change unknown" })).toHaveTextContent("?");
            });
          });
          ''')
          script = Path('scripts/check-dependency-graph-source.mjs')
          s = script.read_text()
          old = '      const initial = await positions();'
          assert s.count(old) == 1
          s = s.replace(old, '''      const categoryPills = cards.locator("[data-graph-category]");
                assert.equal(await categoryPills.count(), 5);
                assert.equal(await categoryPills.filter({ hasText: "Source unchanged" }).count(), 4);
                assert.equal(await categoryPills.filter({ hasText: "Source modified" }).count(), 1);
                const categories = await categoryPills.evaluateAll((pills) => pills.map((pill) => {
                  const box = pill.getBoundingClientRect();
                  const card = pill.closest("[data-graph-resource-card]").getBoundingClientRect();
                  const identity = pill.closest("[data-graph-resource-card]").querySelector("[data-graph-resource-label]").getBoundingClientRect();
                  return { inside: box.left >= card.left && box.right <= card.right + 1, belowIdentity: box.top >= identity.bottom - 1, radius: parseFloat(getComputedStyle(pill).borderRadius) };
                }));
                for (const pill of categories) {
                  assert.ok(pill.inside, `${name}: category stays inside the card`);
                  assert.ok(pill.belowIdentity, `${name}: category does not compete with identity`);
                  assert.ok(pill.radius >= 999, `${name}: category has pill geometry`);
                }
                const initial = await positions();''')
          script.write_text(s)
          PY
      - name: Install dependencies
        run: npm i --no-audit --no-fund > /tmp/graph-pill-install.log 2>&1
      - name: Format changed sources
        run: |
          git diff --name-only --diff-filter=AM -- easy-ui-react/src/DependencyGraph scripts/check-dependency-graph-source.mjs | xargs npx prettier --write
          npx prettier --write easy-ui-react/src/DependencyGraph/DependencyGraphCategories.tsx easy-ui-react/src/DependencyGraph/DependencyGraph.categories.test.tsx
      - name: Build
        run: npm run build > /tmp/graph-pill-build.log 2>&1
      - name: Lint
        run: npm run lint > /tmp/graph-pill-lint.log 2>&1
      - name: Unit tests
        run: npm run test > /tmp/graph-pill-test.log 2>&1
      - name: Storybook
        run: npm run build:storybook > /tmp/graph-pill-storybook.log 2>&1
      - name: Install browser
        run: |
          npm ci --prefix scripts/preview-metrics --no-audit --no-fund
          cd scripts/preview-metrics
          npx playwright install --with-deps chromium
      - name: Browser regressions and screenshots
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/scripts/preview-metrics/node_modules/playwright
          STORYBOOK_URL: http://127.0.0.1:9018
          FACILITY_REPORT_DIR: /tmp/graph-pill-browser
        run: |
          python3 -m http.server 9018 --bind 127.0.0.1 --directory storybook-static > /tmp/graph-pill-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent "$STORYBOOK_URL/iframe.html" > /dev/null; then break; fi
            sleep 1
          done
          node scripts/check-dependency-graph.mjs > /tmp/graph-pill-browser.log 2>&1
          node scripts/check-dependency-graph-source.mjs >> /tmp/graph-pill-browser.log 2>&1
      - name: Commit verified sources and current evidence
        run: |
          cp /tmp/graph-pill-browser/dependency-graph/source-only-evidence-light-1440.png documentation/images/dependency-graph-source-only-desktop.png
          cp /tmp/graph-pill-browser/dependency-graph/source-only-evidence-dark-390.png documentation/images/dependency-graph-source-only-mobile.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add easy-ui-react/src/DependencyGraph scripts/check-dependency-graph-source.mjs documentation/images/dependency-graph-source-only-desktop.png documentation/images/dependency-graph-source-only-mobile.png
          git diff --cached --check
          git commit -m 'fix(dependency-graph): show explicit categories as compact pills'
          git push origin HEAD:fix/dependency-graph-real-world
          git rev-parse HEAD > /tmp/graph-pill-head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graph-category-pill-evidence
          path: |
            /tmp/graph-pill-*.log
            /tmp/graph-pill-head.txt
            /tmp/graph-pill-browser
            easy-ui-react/src/DependencyGraph
            scripts/check-dependency-graph-source.mjs
