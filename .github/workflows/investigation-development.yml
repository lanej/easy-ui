name: Investigation development snapshot

on:
  push:
    branches: [codex/investigation-workbench]
    paths: [.github/workflows/investigation-development.yml]

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:tokens && npm run build:icons
      - name: Package isolated development inputs
        run: |
          tar --exclude='./.git' --exclude='./.turbo' --exclude='./.ui-review' --exclude='*/.cache' -czf "$RUNNER_TEMP/investigation-runtime.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: investigation-development-runtime
          path: ${{ runner.temp }}/investigation-runtime.tar.gz
          retention-days: 1
          compression-level: 0
