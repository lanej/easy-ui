name: Investigation revision inputs
on:
  push:
    branches: [codex/investigation-workbench]
    paths: [.github/workflows/investigation-revision-inputs.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package current source
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/source-revision.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: investigation-revision-source
          path: |
            ${{ runner.temp }}/source.tar.gz
            ${{ runner.temp }}/source-revision.txt
          retention-days: 1
