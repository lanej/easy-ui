name: Investigation workspace

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "easy-ui-react/src/EventTimeline/**"
      - "easy-ui-react/src/EventDetails/**"
      - "easy-ui-react/src/EventMetrics/**"
      - "easy-ui-react/src/InvestigationWorkspace/**"
      - "easy-ui-react/src/PathComparison/**"
      - "easy-ui-react/src/NetworkMap/**"
      - "easy-ui-react/src/HealthAssessment/**"
      - "easy-ui-react/src/HealthOutcome/**"
      - "easy-ui-react/src/ConcentrationReference/**"
      - "easy-ui-react/src/DurationDistribution/**"
      - "easy-ui-react/src/PercentileDistribution/**"
      - "easy-ui-react/src/VisualizationFrame/**"
      - "easy-ui-react/src/visualization/**"
      - "easy-ui-react/src/styles/**"
      - "easy-ui-tokens/**"
      - ".storybook/**"
      - "scripts/check-event-timeline.mjs"
      - "scripts/check-investigation-workspace.mjs"
      - "scripts/check-investigation-workbench.mjs"
      - "scripts/preview-metrics/package*.json"
      - ".github/workflows/investigation-workspace.yml"
      - ".github/actions/browser-proof/**"
      - "scripts/browser-proof.mjs"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: investigation-workspace-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:storybook
        env:
          STORYBOOK_TEST_RECIPES: "true"
      - name: Install browser dependencies
        working-directory: scripts/preview-metrics
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - uses: ./.github/actions/browser-proof
        id: proof
        with:
          suite: event-timeline
          built: storybook-static
      - name: Verify linked interaction and responsive Storybook layouts
        if: steps.proof.outputs.reuse != 'true'
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/scripts/preview-metrics/node_modules/playwright
          STORYBOOK_URL: http://127.0.0.1:9019
          EVENT_TIMELINE_REPORT_DIR: ${{ runner.temp }}/event-timeline-browser
          INVESTIGATION_REPORT_DIR: ${{ runner.temp }}/investigation-workspace-browser
          WORKBENCH_REPORT_DIR: ${{ runner.temp }}/investigation-workbench-browser
        run: |
          python3 -m http.server 9019 --bind 127.0.0.1 --directory storybook-static > "$RUNNER_TEMP/investigation-storybook.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent "$STORYBOOK_URL/iframe.html" > /dev/null; then break; fi
            sleep 1
          done
          node scripts/check-event-timeline.mjs
          node scripts/check-investigation-workspace.mjs
          node scripts/check-investigation-workbench.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: investigation-workspace-browser
          path: |
            ${{ runner.temp }}/event-timeline-browser
            ${{ runner.temp }}/investigation-workspace-browser
            ${{ runner.temp }}/investigation-workbench-browser
            ${{ runner.temp }}/investigation-storybook.log
      - uses: ./.github/actions/browser-proof
        if: success() && steps.proof.outputs.reuse != 'true'
        with:
          mode: record
          suite: event-timeline
          digest: ${{ steps.proof.outputs.digest }}
