name: MeterBar formatting repair
on:
  push:
    branches: [main]
    paths: [.github/workflows/meter-bar-format-repair.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format only the changed MeterBar files
        run: >-
          npx --no-install prettier --write
          easy-ui-react/src/MeterBar/MeterBar.colors.test.tsx
          easy-ui-react/src/MeterBar/MeterBar.tsx
          easy-ui-react/src/MeterBar/MeterBarFixtures.stories.tsx
          scripts/check-meter-bar-comparison.mjs
          scripts/check-meter-bar.mjs
      - name: Prepare formatted commit without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const repo = process.env.GITHUB_REPOSITORY;
          const parent = process.env.GITHUB_SHA;
          async function api(path, method = 'GET', data) {
            const response = await fetch(`https://api.github.com/repos/${repo}/${path}`, {
              method,
              headers: {
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                Accept: 'application/vnd.github+json',
                'Content-Type': 'application/json',
              },
              body: data === undefined ? undefined : JSON.stringify(data),
            });
            if (!response.ok) throw new Error(`${method} ${path}: ${response.status} ${await response.text()}`);
            return response.json();
          }
          const paths = [
            'easy-ui-react/src/MeterBar/MeterBar.colors.test.tsx',
            'easy-ui-react/src/MeterBar/MeterBar.tsx',
            'easy-ui-react/src/MeterBar/MeterBarFixtures.stories.tsx',
            'scripts/check-meter-bar-comparison.mjs',
            'scripts/check-meter-bar.mjs',
          ];
          const tree = [];
          for (const path of paths) {
            const content = await readFile(path, 'utf8');
            tree.push({ path, mode: '100644', type: 'blob', content });
          }
          tree.push({ path: '.github/workflows/meter-bar-format-repair.yml', mode: '100644', type: 'blob', sha: null });
          const source = await api(`git/commits/${parent}`);
          const result = await api('git/trees', 'POST', { base_tree: source.tree.sha, tree });
          const commit = await api('git/commits', 'POST', {
            message: 'style(MeterBar): apply repository formatting and remove repair workflow',
            tree: result.sha,
            parents: [parent],
          });
          console.log(`REPAIR_PARENT=${parent}`);
          console.log(`REPAIR_COMMIT=${commit.sha}`);
          console.log(`REPAIR_TREE=${result.sha}`);
          NODE
      - name: Show formatting diff
        run: git diff --stat && git diff --check
