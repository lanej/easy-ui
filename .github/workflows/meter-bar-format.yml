name: Compact risk focused review
on:
  push:
    branches: [review/meter-bar-30]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ace89de1a909734245d0cb1c9175e214e0ad5693
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version-file: source/.nvmrc
      - name: Apply the reviewed changes
        run: |
          python3 .review/apply-risk.py source
          python3 .review/refine-colors.py source
      - name: Install and build the source packages
        working-directory: source
        run: npm ci --no-audit --no-fund
      - name: Format only changed source
        working-directory: source
        run: |
          git add .changeset/compact-risk-and-bidi.md easy-ui-react/skills/easy-ui/references/components.md easy-ui-react/src/MeterBar easy-ui-react/src/ProportionBar easy-ui-react/src/RiskScore scripts/check-meter-bar.mjs
          git diff --cached --name-only -z | xargs -0 ./node_modules/.bin/prettier --write
      - name: Focused unit and source checks
        working-directory: source
        run: |
          npm run test --workspace=@easypost/easy-ui -- src/RiskScore src/ProportionBar src/MeterBar | tee "$RUNNER_TEMP/compact-risk-tests.log"
          npx eslint easy-ui-react/src/RiskScore easy-ui-react/src/ProportionBar easy-ui-react/src/MeterBar --ext .ts,.tsx
          npx stylelint easy-ui-react/src/RiskScore/RiskScore.module.scss
          node --check scripts/check-meter-bar.mjs
      - name: Retain the prepared source on a review branch
        working-directory: source
        run: |
          git add .changeset/compact-risk-and-bidi.md easy-ui-react/skills/easy-ui/references/components.md easy-ui-react/src/MeterBar easy-ui-react/src/ProportionBar easy-ui-react/src/RiskScore scripts/check-meter-bar.mjs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: isolate RTL ratios and simplify compact risk scores'
          branch="review/compact-risk-ready-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "HEAD:refs/heads/$branch"
          printf '{"branch":"%s","commit":"%s","tree":"%s"}\n' "$branch" "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" | tee "$RUNNER_TEMP/compact-risk-prepared.json"
          git diff ace89de1a909734245d0cb1c9175e214e0ad5693 HEAD > "$RUNNER_TEMP/compact-risk-prepared.patch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-risk-focused-review
          path: |
            ${{ runner.temp }}/compact-risk-tests.log
            ${{ runner.temp }}/compact-risk-prepared.json
            ${{ runner.temp }}/compact-risk-prepared.patch
