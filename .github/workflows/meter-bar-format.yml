name: Compact risk live review
on:
  push:
    branches: [review/meter-bar-30]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_REVISION: 375f9f1582e0c96c4f79cdcd587b813aeb27b9c3
      REVISION_URL: https://lanej.io/previews/easy-ui/pr-30/revision.txt
      STORYBOOK_URL: https://lanej.io/previews/easy-ui/pr-30/storybook
      FACILITY_REPORT_DIR: /tmp/compact-risk-live
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 375f9f1582e0c96c4f79cdcd587b813aeb27b9c3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install browser tools
        working-directory: scripts/preview-metrics
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Wait for the matching live preview
        run: |
          mkdir -p "$FACILITY_REPORT_DIR"
          for attempt in {1..45}; do
            revision=$(curl --fail --silent "$REVISION_URL?review=$GITHUB_RUN_ID" || true)
            if [ "$revision" = "$EXPECTED_REVISION" ]; then
              printf '%s\n' "$revision" > "$FACILITY_REPORT_DIR/revision-before.txt"
              exit 0
            fi
            sleep 15
          done
          echo 'The hosted revision did not match the reviewed source.' >&2
          exit 1
      - name: Verify and capture the live components
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/scripts/preview-metrics/node_modules/playwright
        run: |
          node scripts/check-proportion-bar.mjs
          revision=$(curl --fail --silent "$REVISION_URL?review=$GITHUB_RUN_ID-after")
          test "$revision" = "$EXPECTED_REVISION"
          printf '%s\n' "$revision" > "$FACILITY_REPORT_DIR/revision-after.txt"
      - name: Retain representative images on a review-only branch
        run: |
          cp "$FACILITY_REPORT_DIR/proportion-bar/risk-compact-dark-1040.png" documentation/images/risk-score-compact-dark.png
          cp "$FACILITY_REPORT_DIR/proportion-bar/risk-compact-dark-320.png" documentation/images/risk-score-compact-mobile.png
          cp "$FACILITY_REPORT_DIR/proportion-bar/meter-localized-right-to-left-dark-1040.png" documentation/images/meter-rtl-localized.png
          git add documentation/images/risk-score-compact-dark.png documentation/images/risk-score-compact-mobile.png documentation/images/meter-rtl-localized.png
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'review: retain compact risk and RTL live captures'
          branch="review/compact-risk-preview-30-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "HEAD:refs/heads/$branch"
          printf '{"branch":"%s","capture_commit":"%s","source":"%s"}\n' "$branch" "$(git rev-parse HEAD)" "$EXPECTED_REVISION" > "$FACILITY_REPORT_DIR/captures.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-risk-live
          path: /tmp/compact-risk-live
          retention-days: 14
