name: MeterBar repair diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/meterbar-repair-diagnostic.yml

permissions:
  contents: read

jobs:
  format:
    if: github.head_ref == 'fix/meterbar-risk-score-repair'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run the repository formatter on the repair files
        run: |
          npx --no-install prettier --write \
            easy-ui-react/src/MeterBar/MeterBar.tsx \
            easy-ui-react/src/MeterBar/MeterBar.colors.test.tsx \
            easy-ui-react/src/MeterBar/MeterBar.comparison.test.tsx \
            easy-ui-react/src/MeterBar/MeterBarFixtures.stories.tsx \
            easy-ui-react/src/RiskScore/RiskScore.tsx \
            scripts/check-meter-bar.mjs \
            scripts/check-meter-bar-comparison.mjs
          git diff --check
          git diff > meterbar-format.diff
          cat meterbar-format.diff
      - uses: actions/upload-artifact@v4
        with:
          name: meterbar-formatted-source
          path: |
            meterbar-format.diff
            easy-ui-react/src/MeterBar/MeterBar.tsx
            easy-ui-react/src/MeterBar/MeterBar.colors.test.tsx
            easy-ui-react/src/MeterBar/MeterBar.comparison.test.tsx
            easy-ui-react/src/MeterBar/MeterBarFixtures.stories.tsx
            easy-ui-react/src/RiskScore/RiskScore.tsx
            scripts/check-meter-bar.mjs
            scripts/check-meter-bar-comparison.mjs
          if-no-files-found: error
