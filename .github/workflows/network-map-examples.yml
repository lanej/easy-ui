name: Network map examples
on:
  pull_request:
    paths:
      - ".ui-review/maps/**"
      - "easy-ui-react/src/visualization/**"
      - "easy-ui-react/src/NetworkMap/**"
      - "easy-ui-react/package.json"
      - "easy-ui-react/vite.config.mts"
      - "scripts/preview-maps/**"
      - ".github/workflows/network-map-examples.yml"
permissions:
  contents: read
jobs:
  browser:
    name: Maps (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            os: ubuntu-latest
          - browser: firefox
            os: ubuntu-latest
          - browser: safari
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: scripts/preview-maps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run measure
      - if: matrix.browser != 'safari'
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - if: matrix.browser == 'chrome'
        run: npm run capture
        env:
          MAP_BROWSER: chrome
      - if: matrix.browser == 'firefox'
        run: xvfb-run -a npm run capture
        env:
          MAP_BROWSER: firefox
          LIBGL_ALWAYS_SOFTWARE: "1"
          MOZ_WEBRENDER: "1"
      - if: matrix.browser == 'safari'
        run: sudo safaridriver --enable
      - if: matrix.browser == 'safari'
        run: npm run audit:safari
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: network-maps-${{ matrix.browser }}
          path: |
            scripts/preview-maps/screenshots/
            scripts/preview-maps/dist/
          if-no-files-found: warn
  layout:
    name: Map layout review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - name: Check out View Rule 0.7.0 (pinned)
        uses: actions/checkout@v4
        with:
          repository: lanej/viewrule
          ref: 6d36031935a824c650e049a14aeb9770e042bb95
          path: .viewrule-engine
      - name: Install View Rule and Chromium
        working-directory: .viewrule-engine
        run: |
          npm ci --omit=dev --no-audit --no-fund
          node bin/viewrule.mjs install-browser --with-deps
      - name: Build map examples
        working-directory: scripts/preview-maps
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Review map composition and larger text
        run: |
          cp .ui-review/maps/config.json .ui-review/config.json
          cp .ui-review/maps/rules.json .ui-review/rules.json
          node --input-type=module -e 'import { chromium } from "./.viewrule-engine/node_modules/playwright/index.mjs"; import { writeFileSync } from "node:fs"; writeFileSync("/tmp/map-review-browser", "#!/bin/sh\nexec \"" + chromium.executablePath() + "\" --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader \"$@\"\n", {mode: 0o755});'
          cd scripts/preview-maps
          npm exec vite -- preview --host 127.0.0.1 --port 4174 --strictPort > /tmp/map-layout-preview.log 2>&1 &
          cd ../..
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4174/composition.html > /dev/null; then break; fi
            sleep 1
          done
          VIEWRULE_BROWSER_PATH=/tmp/map-review-browser node .viewrule-engine/bin/viewrule.mjs check --full
      - name: Upload map layout findings and captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-layout-review
          path: .ui-review/runs/
          include-hidden-files: true
          if-no-files-found: warn
