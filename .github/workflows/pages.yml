name: Documentation site

on:
  push:
    branches:
      - main
      - feat/metric-card-sparkline
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - ".storybook/**"
      - "docs-site/**"
      - "easy-ui-react/src/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/build-docs.mjs"
      - "scripts/check-docs-site.mjs"
      - "scripts/preview-metrics/**"
      - "scripts/preview-maps/**"
      - "typedoc.json"
      - "scripts/browser-proof.mjs"
      - ".github/actions/browser-proof/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deployment' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    outputs:
      map_reuse: ${{ steps.map-proof.outputs.reuse }}
      map_digest: ${{ steps.map-proof.outputs.digest }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Charts, maps, and guide examples share one source revision.
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - name: Install repository dependencies
        run: npm ci
      - name: Install chart gallery dependencies
        run: npm ci --prefix scripts/preview-metrics --no-audit --no-fund
      - name: Install map gallery dependencies
        if: hashFiles('scripts/preview-maps/package-lock.json') != ''
        run: npm ci --prefix scripts/preview-maps --no-audit --no-fund
      - name: Build documentation and examples
        run: npm run build:docs
      - name: Verify documentation outputs
        run: node scripts/check-docs-site.mjs
      - id: map-proof
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/browser-proof
        with:
          suite: hosted-maps
          built: docs-site/maps
      - name: Record source revision
        run: git rev-parse HEAD > docs-site/revision.txt
      - name: Upload documentation build
        uses: actions/upload-artifact@v4
        with:
          name: easy-ui-documentation-site
          path: docs-site
          include-hidden-files: true
          if-no-files-found: error

  assemble:
    outputs:
      map_revision: ${{ steps.revisions.outputs.map_revision }}
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download chart documentation
        uses: actions/download-artifact@v4
        with:
          name: easy-ui-documentation-site
          path: published-site
      - name: Download map documentation
        uses: actions/download-artifact@v4
        with:
          name: easy-ui-documentation-site
          path: published-site/network-maps
      - name: Verify both previews are included
        id: revisions
        run: |
          test -f published-site/index.html
          test -f published-site/storybook/index.html
          test -f published-site/api/index.html
          test -f published-site/comparisons/modular/portfolio/index.html
          test -f published-site/network-maps/index.html
          test -f published-site/network-maps/storybook/index.html
          test -f published-site/network-maps/api/index.html
          test -f published-site/network-maps/maps/index.html
          touch published-site/.nojekyll
          echo "map_revision=$(cat published-site/network-maps/revision.txt)" >> "$GITHUB_OUTPUT"
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: published-site

  deploy:
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    if: github.event_name != 'pull_request'
    needs: assemble
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy documentation site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify this deployment's revision and inspector assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ needs.assemble.outputs.map_revision }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { setTimeout } from 'node:timers/promises';
          const read = async (path) => {
            const response = await fetch(new URL(path, process.env.PAGE_URL), { signal: AbortSignal.timeout(15000) });
            assert(response.ok, `${path}: ${response.status}`);
            return response;
          };
          for (let attempt = 0; ; attempt++) {
            try {
              for (const prefix of ['', 'network-maps/']) {
                assert.equal((await (await read(`${prefix}revision.txt`)).text()).trim(), process.env.EXPECTED_SHA);
                const report = await (await read(`${prefix}maps/bundle-report.json`)).json();
                assert.equal(report.sourceCommit, process.env.EXPECTED_SHA);
                await read(`${prefix}maps/regressions.html`);
                for (const file of [report.customInspectorChartEngine.entry, ...report.workerAssets.map(asset => asset.file)])
                  await read(`${prefix}maps/${file}`);
              }
              break;
            } catch (error) {
              if (attempt === 5) throw error;
              await setTimeout(3000);
            }
          }
          NODE

  verify-hosted-maps:
    if: github.event_name != 'pull_request' && needs.build.outputs.map_reuse != 'true'
    needs: [build, assemble, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.assemble.outputs.map_revision }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: scripts/preview-maps/package-lock.json
      - name: Install map browser checks
        run: npm ci --no-audit --no-fund
        working-directory: scripts/preview-maps
      - name: Install Chrome
        run: npx playwright install --with-deps chrome
        working-directory: scripts/preview-maps
      - name: Check published map interactions, assets and accessibility
        run: npm run capture
        working-directory: scripts/preview-maps
        env:
          MAP_BROWSER: chrome
          MAP_BASE_URL: ${{ needs.deploy.outputs.page_url }}network-maps/maps/
      - name: Upload hosted map evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-maps-hosted-chrome
          path: scripts/preview-maps/screenshots/
          if-no-files-found: warn
      - uses: ./.github/actions/browser-proof
        if: success()
        with:
          mode: record
          suite: hosted-maps
          digest: ${{ needs.build.outputs.map_digest }}
