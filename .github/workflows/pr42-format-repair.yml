name: PR 42 formatting repair
on:
  pull_request:
    paths:
      - '.github/workflows/pr42-format-repair.yml'
permissions:
  contents: write
jobs:
  prepare:
    if: github.event.pull_request.number == 42 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - name: Format affected sources using repository configuration
        run: |
          npx prettier --write easy-ui-react/src/Pill/Pill.tsx easy-ui-react/src/Pill/Pill.compact.test.tsx
          git diff --check
          git diff -- easy-ui-react/src/Pill/Pill.tsx easy-ui-react/src/Pill/Pill.compact.test.tsx
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const entries = [];
            for (const path of ['easy-ui-react/src/Pill/Pill.tsx', 'easy-ui-react/src/Pill/Pill.compact.test.tsx']) {
              const content = fs.readFileSync(path, 'utf8');
              const {data} = await github.rest.git.createBlob({...context.repo, content, encoding: 'utf-8'});
              entries.push({path, sha: data.sha, mode: '100644', type: 'blob'});
            }
            fs.writeFileSync('pr42-format-repair.json', JSON.stringify({source_sha: context.payload.pull_request.head.sha, entries}, null, 2));
      - uses: actions/upload-artifact@v4
        with:
          name: pr42-format-repair
          path: |
            pr42-format-repair.json
            easy-ui-react/src/Pill/Pill.tsx
            easy-ui-react/src/Pill/Pill.compact.test.tsx
