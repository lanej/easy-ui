name: ProportionBar focused review

on:
  push:
    branches: [feat/proportion-bar]
  workflow_dispatch: ~

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci > /tmp/install.log 2>&1
      - name: Format affected source
        run: npx prettier --write easy-ui-react/src/ProportionBar scripts/check-proportion-bar.mjs scripts/preview-metrics/native-regressions.tsx
      - name: Capture formatted source
        run: |
          mkdir -p /tmp/proportion-review
          cp -r easy-ui-react/src/ProportionBar /tmp/proportion-review/
          cp scripts/check-proportion-bar.mjs scripts/preview-metrics/native-regressions.tsx /tmp/proportion-review/
          git diff > /tmp/proportion-review/format.patch
      - name: Lint affected component
        working-directory: easy-ui-react
        run: |
          npx eslint src/ProportionBar > /tmp/proportion-review/eslint.log 2>&1
          npx stylelint 'src/ProportionBar/*.scss' > /tmp/proportion-review/stylelint.log 2>&1
      - name: Unit tests
        working-directory: easy-ui-react
        run: npx vitest run src/ProportionBar > /tmp/proportion-review/tests.log 2>&1
      - name: Build Storybook
        run: npm run build:storybook > /tmp/proportion-review/storybook.log 2>&1
      - name: Install browser checks
        run: |
          npm ci --prefix scripts/preview-metrics --no-audit --no-fund > /tmp/proportion-review/browser-install.log 2>&1
          cd scripts/preview-metrics && npx playwright install --with-deps chromium > /tmp/proportion-review/chromium.log 2>&1
      - name: Render component
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/scripts/preview-metrics/node_modules/playwright
          STORYBOOK_URL: http://127.0.0.1:9018
          FACILITY_REPORT_DIR: /tmp/proportion-review
        run: |
          python3 -m http.server 9018 --bind 127.0.0.1 --directory storybook-static > /tmp/proportion-review/server.log 2>&1 &
          sleep 2
          node scripts/check-proportion-bar.mjs > /tmp/proportion-review/browser.log 2>&1
      - name: Retain focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proportion-review
          path: /tmp/proportion-review
          if-no-files-found: warn
      - name: Diagnostics
        if: failure()
        run: |
          for log in /tmp/proportion-review/{eslint,stylelint,tests,browser}.log; do
            if test -f "$log"; then echo "::group::$log"; tail -n 50 "$log"; echo '::endgroup::'; fi
          done
