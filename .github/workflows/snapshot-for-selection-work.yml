name: Temporary selection workbench source snapshot
on:
  push:
    branches: [codex/investigation-workbench]
    paths: [.github/workflows/snapshot-for-selection-work.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive exact branch source
        run: |
          git rev-parse HEAD > source-revision.txt
          git archive --format=tar.gz --output=source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: selection-source
          path: |
            source.tar.gz
            source-revision.txt
          retention-days: 1
