name: Timeline Storybook visual proof

on:
  pull_request:
    branches: [main]
    paths:
      - "easy-ui-react/src/EventTimeline/**"
      - "scripts/capture-event-timeline-storybook.mjs"
      - ".github/workflows/timeline-storybook-visual-proof.yml"

permissions:
  contents: write

concurrency:
  group: timeline-storybook-visual-proof
  cancel-in-progress: true

jobs:
  capture:
    if: github.repository == 'lanej/easy-ui' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reusable-event-timeline
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - name: Install repository dependencies
        run: npm ci --no-audit --no-fund
      - name: Format changed source, tests and stories
        run: |
          npx prettier --write \
            easy-ui-react/src/EventTimeline/EventTimeline.module.scss \
            easy-ui-react/src/EventTimeline/EventTimeline.examples.module.scss \
            easy-ui-react/src/EventTimeline/EventTimeline.stories.tsx \
            easy-ui-react/src/EventTimeline/EventTimeline.test.tsx \
            easy-ui-react/src/EventTimeline/EventTimeline.mdx \
            scripts/capture-event-timeline-storybook.mjs
      - name: Build Storybook
        run: |
          npm run build:tokens
          npm run build:icons
          npm run build:storybook -- --output-dir storybook-static
      - name: Install screenshot browser
        run: |
          npm ci --prefix scripts/preview-maps --no-audit --no-fund
          cd scripts/preview-maps
          npx playwright install --with-deps chromium
      - name: Validate and capture rendered timeline views
        run: node scripts/capture-event-timeline-storybook.mjs
      - name: Commit verified Storybook captures and formatting
        run: |
          git add easy-ui-react/src/EventTimeline scripts/capture-event-timeline-storybook.mjs \
            documentation/images/event-timeline-presentation-light.png \
            documentation/images/event-timeline-presentation-dark.png \
            documentation/images/event-timeline-map-adjacent.png \
            documentation/images/event-timeline-quantiles-narrow.png \
            documentation/images/event-timeline-concentration-inline.png
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(timeline): capture readable gradient and corrected status-dot spacing"
          git push origin HEAD:feat/reusable-event-timeline
