name: Verify compact workbench controls
on:
  push:
    branches: [codex/investigation-workbench]
    paths: [.github/workflows/workbench-local-verification-inputs.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply exact locally tested patches
        shell: bash
        run: |
          set -euo pipefail
          echo '85fc980ef5d70c24319e6b4e0b5a523eca627c8f9ea89e70673b4b1e1b2dc2c5  .ui-review/pr-76-control-layout.patch' | sha256sum --check
          echo 'f393629168794912bfa1fe0c21982fba05697fb8201ef77899a73d94f066d87e  .ui-review/pr-76-callback-compatibility.patch' | sha256sum --check
          git apply --check .ui-review/pr-76-control-layout.patch .ui-review/pr-76-callback-compatibility.patch
          git apply .ui-review/pr-76-control-layout.patch .ui-review/pr-76-callback-compatibility.patch
      - run: npm ci --no-audit --no-fund
      - name: Verify unit tests and lint
        run: |
          npm test --workspace @easypost/easy-ui
          npm run lint --workspace @easypost/easy-ui
      - name: Retain exact verified code revision
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/workbench-local-verification-inputs.yml .ui-review/pr-76-control-layout.patch .ui-review/pr-76-callback-compatibility.patch
          git add easy-ui-react/src/InvestigationWorkspace easy-ui-react/src/EventTimeline/EventTimeline.tsx easy-ui-react/src/NetworkMap easy-ui-react/skills/easy-ui/references/components.md scripts/check-investigation-workbench.mjs
          git commit -m 'Align prediction rows and compact history controls; fix overlay and selection callbacks'
          git push origin HEAD:codex/investigation-workbench
          echo "SOURCE_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build real components
        run: npm run build:storybook
        env:
          STORYBOOK_TEST_RECIPES: 'true'
      - name: Verify public component coverage and packed package
        run: |
          npm run check:storybook
          node scripts/check-style-package.mjs
      - name: Prepare browser libraries
        working-directory: scripts/preview-metrics
        run: npm ci --no-audit --no-fund
      - name: Capture and verify rendered controls
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/scripts/preview-metrics/node_modules/playwright
          STORYBOOK_URL: http://127.0.0.1:9019
          WORKBENCH_REPORT_DIR: ${{ runner.temp }}/workbench-controls-browser
          EVENT_TIMELINE_REPORT_DIR: ${{ runner.temp }}/event-timeline-browser
        run: |
          set -euo pipefail
          export BROWSER_EXECUTABLE_PATH="$(command -v google-chrome || command -v chromium)"
          python3 -m http.server 9019 --bind 127.0.0.1 --directory storybook-static > "$RUNNER_TEMP/browser-server.log" 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER"' EXIT
          for attempt in {1..30}; do curl --fail --silent "$STORYBOOK_URL/iframe.html" > /dev/null && break; sleep 1; done
          node scripts/check-event-timeline.mjs
          node scripts/check-investigation-workbench.mjs
      - name: Retain exact capture evidence
        run: |
          DEST=".ui-review/pr-76/$SOURCE_REVISION"
          mkdir -p "$DEST"
          cp "$RUNNER_TEMP/workbench-controls-browser/"*.png "$DEST/"
          cp "$RUNNER_TEMP/workbench-controls-browser/"*.json "$DEST/"
          git add "$DEST"
          git commit -m 'Capture verified compact prediction and timeline controls'
          git push origin HEAD:codex/investigation-workbench
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-control-layout-verification
          path: |
            ${{ runner.temp }}/workbench-controls-browser
            ${{ runner.temp }}/event-timeline-browser
            ${{ runner.temp }}/browser-server.log
          retention-days: 7
