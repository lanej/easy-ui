<svg xmlns="http://www.w3.org/2000/svg" width="960" height="354" viewBox="0 0 960 354" role="img" aria-labelledby="title description" font-family="Poppins, Arial, sans-serif">
  <title id="title">From building blocks to reusable organisms</title>
  <desc id="description">Atoms combine into molecules and larger reusable organisms, the highest component level in Storybook. Shared foundations support every level. The arrows show composition, not a required dependency chain.</desc>
  <rect width="960" height="354" rx="12" fill="#FFFFFF"/>
  <text x="20" y="34" font-size="24" font-weight="700" fill="#000000">From building blocks to reusable organisms</text>
  <g fill="#FFFFFF" stroke="#C6CFE0">
    <rect x="20" y="62" width="280" height="184" rx="10"/>
    <rect x="340" y="62" width="280" height="184" rx="10"/>
    <rect x="660" y="62" width="280" height="184" rx="10"/>
  </g>
  <g font-size="18" font-weight="700" fill="#164DFF">
    <text x="36" y="92">Atoms</text>
    <text x="356" y="92">Molecules</text>
    <text x="676" y="92">Organisms</text>
  </g>
  <g font-size="13" fill="#47547F">
    <text x="36" y="115">Small building blocks</text>
    <text x="356" y="115">One focused purpose</text>
    <text x="676" y="115">Highest component level</text>
  </g>
  <g stroke="#47547F" stroke-width="1.5" fill="none">
    <path d="M308 162h24m-5-4 5 4-5 4"/>
    <path d="M628 162h24m-5-4 5 4-5 4"/>
  </g>
  <rect x="36" y="142" width="248" height="38" rx="6" fill="#164DFF"/>
  <text x="160" y="167" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">Button</text>
  <text x="36" y="212" font-size="14" font-weight="600" fill="#000000">Text · Icon · Input</text>
  <rect x="356" y="142" width="248" height="38" rx="6" fill="#F1F1F1" stroke="#C6CFE0"/>
  <text x="368" y="167" font-size="14" fill="#000000">Select a location</text>
  <path d="m584 157 5 5 5-5" stroke="#47547F" stroke-width="1.5" fill="none"/>
  <text x="356" y="212" font-size="14" font-weight="600" fill="#000000">Select · MetricCard</text>
  <rect x="676" y="138" width="248" height="52" rx="6" fill="#F1F1F1"/>
  <path d="m700 170 62-18 63 26 73-21" stroke="#164DFF" stroke-width="3" fill="none"/>
