    <path d="M160 246v25M480 246v25M800 246v25"/>
  </g>
  <rect x="20" y="272" width="920" height="56" rx="10" fill="#F1F1F1"/>
  <text x="36" y="307" font-size="18" font-weight="700" fill="#164DFF">Foundations</text>
