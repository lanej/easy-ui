<svg xmlns="http://www.w3.org/2000/svg" width="960" height="452" viewBox="0 0 960 452" role="img" aria-labelledby="title description" font-family="Poppins, Arial, sans-serif">
  <title id="title">One component, many story variants</title>
  <desc id="description">NetworkMap is a reusable organism responsible for geography and map interaction. Different datasets, selections, overlays, and empty states are story variants within the same component. Application workflows are outside the Storybook catalog.</desc>
  <rect width="960" height="452" rx="12" fill="#FFFFFF"/>
  <text x="20" y="34" font-size="24" font-weight="700" fill="#000000">One component, many story variants</text>
  <g fill="#FFFFFF" stroke="#C6CFE0">
    <rect x="20" y="62" width="358" height="274" rx="10"/>
    <rect x="472" y="62" width="468" height="274" rx="10"/>
  </g>
  <g font-size="12" font-weight="600" fill="#164DFF">
    <text x="40" y="89">ORGANISM · ORGANISMS / MAPS</text>
    <text x="492" y="89">STORIES WITHIN THE COMPONENT</text>
  </g>
  <g font-size="22" font-weight="700" fill="#000000">
    <text x="40" y="122">NetworkMap</text>
    <text x="492" y="122">States, not new categories</text>
  </g>
  <rect x="40" y="141" width="318" height="119" rx="6" fill="#F1F1F1"/>
  <path d="m82 210 75-40 62 58 93-53M157 170l70-14" stroke="#164DFF" stroke-width="3" fill="none"/>
  <g fill="#164DFF" stroke="#FFFFFF" stroke-width="3">
    <circle cx="82" cy="210" r="7"/>
    <circle cx="157" cy="170" r="7"/>
    <circle cx="219" cy="228" r="7"/>
    <circle cx="312" cy="175" r="7"/>
    <circle cx="227" cy="156" r="7"/>
  </g>
  <text x="40" y="284" font-size="14" font-weight="600" fill="#000000">Geography + map interaction</text>
  <text x="40" y="307" font-size="13" fill="#47547F">Reusable outside any particular task</text>
  <path d="M394 192h60m-7-6 7 6-7 6" stroke="#164DFF" stroke-width="2" fill="none"/>
  <text x="424" y="218" text-anchor="middle" font-size="12" fill="#47547F">demonstrate</text>
  <g fill="#F1F1F1" stroke="#C6CFE0">
    <rect x="492" y="141" width="208" height="50" rx="6"/>
    <rect x="712" y="141" width="208" height="50" rx="6"/>
    <rect x="492" y="203" width="208" height="50" rx="6"/>
    <rect x="712" y="203" width="208" height="50" rx="6"/>
  </g>
  <g font-size="14" font-weight="600" fill="#000000">
    <text x="508" y="171">Different datasets</text>
    <text x="728" y="171">Selected location</text>
    <text x="508" y="233">Points + area overlays</text>
    <text x="728" y="233">Empty data</text>
  </g>
  <text x="492" y="284" font-size="14" font-weight="600" fill="#000000">Same component and interaction contract</text>
  <text x="492" y="307" font-size="13" fill="#47547F">No workflow decisions or application orchestration</text>
  <rect x="20" y="358" width="920" height="73" rx="10" fill="#F1F1F1"/>
  <text x="36" y="386" font-size="15" font-weight="700" fill="#000000">The catalog stops at reusable components</text>
  <text x="36" y="410" font-size="14" fill="#47547F">Task-specific screens and business rules belong to consuming applications, not a higher Storybook level.</text>
</svg>
